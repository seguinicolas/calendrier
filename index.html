<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendriers 🚒</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0 0 90px 0}
  #bar{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;gap:8px;padding:8px;box-sizing:border-box;background:#222}
  #bar button{flex:1;font-size:16px;font-weight:700;border:0;border-radius:12px;color:#fff}
  #don{background:#2e9e4f}#abs{background:#e08a00}#liste{background:#1a73e8}
  #eqsel{position:absolute;top:8px;left:52px;z-index:1000;background:#fff;padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;border:0;box-shadow:0 1px 4px #0006}
  #modal{display:none;position:absolute;inset:0;z-index:2000;background:#0008;align-items:center;justify-content:center}
  #modal .box{background:#fff;padding:20px;border-radius:14px;width:80%;max-width:320px;display:flex;flex-direction:column;gap:10px}
  #modal input,#modal select{font-size:20px;padding:8px}
  #modal .row{display:flex;gap:8px}#modal .row button{flex:1;font-size:17px;padding:10px;border:0;border-radius:8px}
#filtres{position:absolute;bottom:98px;left:8px;z-index:1000;display:flex;gap:6px}
#filtres button{border:2px solid;border-radius:16px;padding:5px 10px;font-size:13px;font-weight:700;background:#fff;color:#333}
#filtres [data-t=don]{border-color:#2e9e4f}#filtres [data-t=absent]{border-color:#e08a00}#filtres [data-t=inoccupe]{border-color:#8e24aa}
#filtres .on[data-t=don]{background:#2e9e4f;color:#fff}#filtres .on[data-t=absent]{background:#e08a00;color:#fff}#filtres .on[data-t=inoccupe]{background:#8e24aa;color:#fff}
#recapbtn{position:absolute;top:50px;left:52px;z-index:1000;background:#fff;padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;border:0;box-shadow:0 1px 4px #0006}
#rtab table{width:100%;border-collapse:collapse;font-size:16px}
#rtab th,#rtab td{padding:12px 8px;border-bottom:1px solid #ddd;text-align:right}
#rtab th:first-child,#rtab td:first-child{text-align:left}
#rtab tr:last-child td{font-weight:700}
.eq{background:#fffb;border:0;box-shadow:none;font-weight:700;font-size:12px;padding:1px 5px}
</style>
</head>
<body>
<div id="map"></div>
<select id="eqsel"><option value="">Toutes les équipes</option><option value="1">Équipe 1</option><option value="2">Équipe 2</option><option value="3">Équipe 3</option><option value="4">Équipe 4</option><option value="5">Équipe 5</option><option value="6">Équipe 6</option><option value="7">Équipe 7</option><option value="8">Équipe 8</option><option value="9">Équipe 9</option><option value="10">Équipe 10</option><option value="11">Équipe 11</option><option value="12">Équipe 12</option><option value="13">Équipe 13</option></select>
<button id="recapbtn">📊 Récap</button>
<div id="recap" style="display:none;position:absolute;inset:0;z-index:3000;background:#fff;overflow:auto">
  <div style="position:sticky;top:0;background:#222;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center"><b id="rtitre">Récapitulatif</b><button id="rclose" style="font-size:16px;padding:6px 12px">Fermer</button></div>
  <div id="rtab" style="padding:12px"></div>
</div>
<div id="filtres"><button data-t="don">💶 Don</button><button data-t="absent">🚪 Absent</button><button data-t="inoccupe">🏚️ Inoccupé</button></div>
<div id="bar">
  <button id="don">💶 Don reçu</button>
  <button id="abs">🚪 Absent</button>
  <button id="liste">📋 Absents</button>
</div>
<div id="modal"><div class="box">
  <b id="titre">Don reçu</b>
  <input id="nom" type="text" placeholder="Nom">
  <input id="adresse" type="text" placeholder="Adresse / lieu-dit">
  <input id="montant" type="number" inputmode="decimal" placeholder="€">
  <select id="mode"><option>Espèces</option><option>Chèque</option></select>
  <input id="note" type="text" placeholder="Note (facultatif)">
  <div class="row"><button id="ok" style="background:#2e9e4f;color:#fff">Valider</button><button id="cancel">Annuler</button></div>
</div></div>
<div id="panel" style="display:none;position:absolute;inset:0;z-index:3000;background:#fff;overflow:auto">
  <div style="position:sticky;top:0;background:#222;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center"><b id="ptitre">Personnes absentes</b><button id="pclose" style="font-size:16px;padding:6px 12px">Fermer</button></div>
  <div id="plist"></div>
</div>

<script>
// Affiche toute erreur en rouge en haut de l'écran (aide au diagnostic)
function erreur(m){const b=document.createElement('div');b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#c00;color:#fff;padding:6px;font-size:12px';b.textContent='Erreur : '+m;document.body.appendChild(b)}
window.onerror=(m,u,l)=>erreur(m+' (ligne '+l+')');
window.addEventListener('unhandledrejection',e=>erreur(String(e.reason)));
const API = 'https://script.google.com/macros/s/AKfycbz6sD97H6fMLxV-n2gB4K6FJxnXZ2hwUHgYRKAdmNq24JG4keXBx4CUSFXJyjSODCkPlw/exec';
const map = L.map('map',{preferCanvas:true}).setView([44.19, 2.34], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

// Couches des secteurs (fichiers GeoJSON à côté de index.html)
const COUL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#008080','#9a6324','#800000','#808000','#000075'];
// Secteur (équipe) d'un point : croisement avec les polygones
const SECT=[];
function dans(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function secteurDe(lng,lat){
  const pt=[lng,lat];
  for(const z of SECT)for(const P of z.polys){
    const b=P.b;if(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3])continue;
    if(dans(pt,P.rings[0])&&!P.rings.slice(1).some(h=>dans(pt,h)))return z;
  }
  return null;
}
function eqPos(lat,lng){const z=secteurDe(lng,lat);return z?{equipe:z.equipe,zone:z.zone}:{equipe:'',zone:''}}
function equipe(a){if(a.eq===undefined&&SECT.length){const z=secteurDe(a.lng,a.lat);a.eq=z?z.equipe:'';a.zone=z?z.zone:''}return a}
function ligneEq(a){equipe(a);return a.eq===undefined?'':(a.eq!==''?`Équipe ${esc(a.eq)} · ${esc(a.zone)}`:'Secteur non défini')}
function secteurs(url,zone){
  const g=L.layerGroup().addTo(map);
  fetch(url+'?v='+Date.now()).then(r=>r.json()).then(d=>{
    const feats=(d.features||[]).filter(f=>f.geometry&&f.geometry.coordinates&&f.geometry.coordinates.length&&f.properties&&f.properties.equipe!=null);
    feats.forEach(f=>{const g=f.geometry,P=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];SECT.push({zone,equipe:f.properties.equipe,polys:P.map(rings=>{const xs=rings[0].map(q=>q[0]),ys=rings[0].map(q=>q[1]);return{rings,b:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}})})});
    L.geoJSON({type:'FeatureCollection',features:feats},{
      interactive:false,
      style:f=>{const c=COUL[(f.properties.equipe-1)%COUL.length];return{color:c,weight:2,fillColor:c,fillOpacity:.25}},
      onEachFeature:(f,l)=>l.bindTooltip('Éq. '+f.properties.equipe,{permanent:true,direction:'center',className:'eq'})
    }).addTo(g);
  }).catch(()=>{});
  return g;
}
const gAdr=L.layerGroup().addTo(map);
L.control.layers(null,{'Secteurs campagne':secteurs('secteurs_campagne.geojson','campagne'),'Secteurs ville':secteurs('secteurs_ville.geojson','ville'),'Adresses':gAdr},{collapsed:true}).addTo(map);

let pos = null, me = null, first = true, total = 0;
const items = [];
navigator.geolocation.watchPosition(p=>{
  pos = {lat:p.coords.latitude, lng:p.coords.longitude};
  if(!me) me = L.circleMarker(pos,{radius:9,color:'#fff',fillColor:'#1a73e8',fillOpacity:1,weight:3}).addTo(map);
  else me.setLatLng(pos);
  if(first){map.setView(pos,17);first=false}
},()=>alert('Active la localisation'),{enableHighAccuracy:true});

const pts={};
const COLS={don:'#2e9e4f',absent:'#e08a00',inoccupe:'#8e24aa'};
const key=r=>r.ida||('p'+r.lat+','+r.lng);
const carre=col=>L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:${col};border:2px solid #fff;box-shadow:0 0 3px #000"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
function addMarker(r){
  if(r.lat===''||r.lng===''||r.lat==null||r.lng==null)return;
  const ok=r.type==='don';
  const col=COLS[r.type]||'#e08a00';
  const st=(ok?r.montant+' € ('+r.mode+')':r.type==='inoccupe'?'Inoccupé':'Absent')+(r.note?' — '+r.note:'');
  const k=key(r);
  let mk=pts[k];
  if(!mk){
    mk=L.marker([r.lat,r.lng],{icon:carre(col)}).addTo(map);
    mk.gps=true;mk.a={id:k,adresse:'',nom:'',lat:r.lat,lng:r.lng,statut:''};
    mk.on('click',()=>showAdr(mk));
    pts[k]=mk;
  }else if(mk.gps)mk.setIcon(carre(col));
  else mk.setStyle({fillColor:col,radius:8});
  if(r.nom)mk.a.nom=r.nom;
  if(mk.gps&&r.adresse)mk.a.adresse=r.adresse;
  mk.a.statut=(mk.a.nom?mk.a.nom+' — ':'')+st;
  const i=items.findIndex(x=>key(x.r)===k);if(i>=0)items.splice(i,1);
  items.push({r,mk});majBtn();applyFilters();
}

// File d'attente (réseau faible sur le terrain)
const getQ=()=>JSON.parse(localStorage.getItem('q')||'[]');
const setQ=q=>localStorage.setItem('q',JSON.stringify(q));
async function flush(){
  let q=getQ();
  while(q.length){
    try{await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(q[0])});q.shift();setQ(q)}
    catch(e){return}
  }
}
function save(r){r.date=new Date().toISOString();Object.assign(r,eqPos(r.lat,r.lng));setQ([...getQ(),r]);addMarker(r);flush()}

function needPos(){if(!pos){alert('Position GPS pas encore trouvée');return false}return true}

const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $=id=>document.getElementById(id);

// Adresse automatique (OpenStreetMap / Nominatim)
async function adresse(p){
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),4000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=fr&lat=${p.lat}&lon=${p.lng}`,{signal:c.signal});
    const a=(await r.json()).address||{};
    return [[a.house_number,a.road].filter(Boolean).join(' '),
            a.hamlet||a.isolated_dwelling||a.locality||a.neighbourhood,
            a.village||a.town||a.city||a.municipality].filter(Boolean).join(', ');
  }catch(e){return ''}
}

let cur=null;
function ouvrir(type,a){
  if(!a&&!needPos())return;
  if(type==='inoccupe'&&a){save({type:'inoccupe',ida:a.id,lat:a.lat,lng:a.lng,nom:a.nom||'',adresse:a.adresse,montant:0,mode:'',note:''});return}
  cur=a?{lat:a.lat,lng:a.lng,type,ida:a.id}:{...pos,type};
  ['nom','adresse','montant','note'].forEach(i=>$(i).value='');
  const don=type==='don';
  $('titre').textContent=don?'Don reçu':'Personne absente';
  $('montant').style.display=$('mode').style.display=don?'':'none';
  $('modal').style.display='flex';
  $('nom').focus();
  if(a){$('adresse').value=a.adresse||'';$('nom').value=a.nom||''}else adresse(cur).then(x=>{if(!$('adresse').value)$('adresse').value=x});
}
$('don').onclick=()=>ouvrir('don');
$('abs').onclick=()=>ouvrir('absent');
$('cancel').onclick=()=>$('modal').style.display='none';
$('ok').onclick=()=>{
  const don=cur.type==='don';
  const m=don?parseFloat($('montant').value.replace(',','.')):0;
  if(don&&!(m>=0)){alert('Montant ?');return}
  save({type:cur.type,ida:cur.ida||'',lat:cur.lat,lng:cur.lng,nom:$('nom').value,adresse:$('adresse').value,montant:m,mode:don?$('mode').value:'',note:$('note').value});
  $('modal').style.display='none';
};

// Liste des absents
const absents=()=>{const e=$('eqsel').value;return items.filter(i=>i.r.type==='absent'&&(!e||String(equipe(i.mk.a).eq)===e))};
function majBtn(){$('liste').textContent='📋 Absents ('+absents().length+')'}
$('eqsel').onchange=()=>{try{localStorage.setItem('eq',$('eqsel').value)}catch(e){}majBtn()};
try{$('eqsel').value=localStorage.getItem('eq')||''}catch(e){}
$('liste').onclick=()=>{
  const l=absents();
  $('ptitre').textContent='Personnes absentes'+($('eqsel').value?' — Équipe '+$('eqsel').value:'');
  $('plist').innerHTML=l.length?'':'<p style="padding:16px">Aucun absent.</p>';
  l.forEach(({r,mk})=>{
    const d=document.createElement('div');
    d.style.cssText='padding:12px 14px;border-bottom:1px solid #ddd';
    d.innerHTML=`<b>${esc(r.nom)||'(sans nom)'}</b><br>${esc(r.adresse)||'adresse inconnue'}`+(ligneEq(mk.a)?`<br>${ligneEq(mk.a)}`:'')+(r.note?`<br><i>${esc(r.note)}</i>`:'');
    d.onclick=()=>{$('panel').style.display='none';map.setView([r.lat,r.lng],18);showAdr(mk)};
    $('plist').appendChild(d);
  });
  $('panel').style.display='block';
};
$('pclose').onclick=()=>$('panel').style.display='none';

// Charger l'historique
// Récapitulatif ville / campagne
const fmt=n=>n.toFixed(2).replace('.00','').replace('.',',')+' €';
function recap(){
  const e=$('eqsel').value;
  const R={ville:{real:0,rest:0,somme:0},campagne:{real:0,rest:0,somme:0}};
  const st={};items.forEach(i=>{st[key(i.r)]=i.r.type});
  const zone=a=>{equipe(a);return a.zone&&(!e||String(a.eq)===e)?R[a.zone]:null};
  Object.values(pts).forEach(mk=>{
    const z=zone(mk.a);if(!z)return;
    const t=st[mk.a.id];
    if(t==='don')z.real++;
    else if(!mk.gps&&t!=='inoccupe')z.rest++;
  });
  items.forEach(({r,mk})=>{if(r.type!=='don')return;const z=zone(mk.a);if(z)z.somme+=Number(r.montant)||0});
  const V=R.ville,C=R.campagne;
  const ligne=(t,a,b,f)=>`<tr><td>${t}</td><td>${f(a)}</td><td>${f(b)}</td><td>${f(a+b)}</td></tr>`;
  $('rtitre').textContent='Récapitulatif'+(e?' — Équipe '+e:' — Toutes les équipes');
  $('rtab').innerHTML='<table><tr><th></th><th>Ville</th><th>Campagne</th><th>Total</th></tr>'
    +ligne('Calendriers réalisés',V.real,C.real,String)
    +ligne('Calendriers restants',V.rest,C.rest,String)
    +ligne('Somme perçue',V.somme,C.somme,fmt)
    +'</table><p style="font-size:13px;color:#555">Restants = adresses du secteur sans don ni inoccupé (absents inclus). Les adresses hors secteur ne sont pas comptées.</p>';
  $('recap').style.display='block';
}
$('recapbtn').onclick=recap;
$('rclose').onclick=()=>$('recap').style.display='none';

// Filtres d'affichage
const filtre={don:true,absent:true,inoccupe:true};
function applyFilters(){
  items.forEach(({r,mk})=>{
    const show=filtre[r.type]!==false;
    if(mk.gps){show?mk.addTo(map):mk.remove()}
    else{show?gAdr.addLayer(mk):gAdr.removeLayer(mk)}
  });
}
document.querySelectorAll('#filtres button').forEach(b=>{
  b.classList.add('on');
  b.onclick=()=>{const t=b.dataset.t;filtre[t]=!filtre[t];b.classList.toggle('on',filtre[t]);applyFilters()};
});

// Points d'adresse (cliquables)
function popupAdr(a,gps){
  const d=document.createElement('div');
  d.innerHTML=`<b>${esc(a.adresse)||'Position GPS'}</b><br>${ligneEq(a)?ligneEq(a)+'<br>':''}${a.statut?esc(a.statut)+'<br>':''}`;
  [['💶 Don','don'],['🚪 Absent','absent'],['🏚️ Inoccupé','inoccupe']].filter(x=>!gps||x[1]!=='inoccupe').forEach(([t,ty])=>{
    const b=document.createElement('button');
    b.textContent=t;b.style.cssText='margin:6px 4px 0 0;padding:8px 10px;font-size:15px';
    b.onclick=()=>{map.closePopup();ouvrir(ty,a)};
    d.appendChild(b);
  });
  return d;
}
function showAdr(mk){L.popup().setLatLng(mk.getLatLng()).setContent(popupAdr(mk.a,mk.gps)).openOn(map)}
gAdr.on('click',e=>showAdr(e.layer));
function chargerAdresses(){
  return fetch('adresses.geojson?v='+Date.now()).then(r=>r.json()).then(d=>{
    d.features.forEach(f=>{
      const [lng,lat]=f.geometry.coordinates;
      const a={id:f.properties.id,adresse:f.properties.adr,nom:'',lat,lng,statut:''};
      const mk=L.circleMarker([lat,lng],{radius:5,color:'#fff',weight:1,fillColor:'#777',fillOpacity:.9}).addTo(gAdr);
      mk.a=a;pts[a.id]=mk;
    });
  }).catch(()=>{});
}
Promise.all([chargerAdresses(),fetch(API).then(r=>r.json()).catch(()=>[])]).then(([_,rows])=>(Array.isArray(rows)?rows:[]).forEach(r=>{try{addMarker(r)}catch(e){}}));
flush();
window.addEventListener('online',flush);
</script>
</body>
</html>
