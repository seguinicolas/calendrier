<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{position:absolute;inset:0 0 90px 0}
  #bar{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;gap:8px;padding:8px;box-sizing:border-box;background:#222}
  #bar button{flex:1;min-width:0;padding:0 4px;font-size:15px;font-weight:700;border:0;border-radius:12px;color:#fff}

  #eqsel{position:absolute;bottom:112px;right:8px;z-index:1000;background:#fff;padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;border:0;box-shadow:0 1px 4px #0006}

  #smodal{display:none;position:absolute;inset:0;z-index:2000;background:#0008;align-items:center;justify-content:center}
  #smodal .box{background:#fff;padding:18px;border-radius:14px;width:80%;max-width:320px;max-height:92%;overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}

  #s_info{font-size:12px;color:#666}
  #smodal .row{display:flex;gap:8px}#smodal .row button{flex:1;font-size:17px;padding:10px;border:0;border-radius:8px}
  #sesbar{display:none;position:absolute;top:8px;left:8px;right:54px;z-index:1000;background:#5e35b1;color:#fff;padding:6px 10px;border-radius:10px;font-size:13px;box-shadow:0 1px 4px #0006;align-items:center;gap:8px}
  body.ses #sesbar{display:flex}

  #sestxt{flex:1;min-width:0}
  #sestxt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bilan{display:none;position:absolute;inset:0;z-index:3500;background:#fff;overflow:auto;font-family:system-ui,sans-serif}
  #bilan .in{max-width:440px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
  #bilan .tete{background:#5e35b1;color:#fff;border-radius:14px;text-align:center;padding:18px 10px;margin-bottom:16px}
  #bilan .tete small{display:block;font-size:14px;opacity:.85;margin-bottom:4px}
  #bilan .tete .t{font-size:40px;font-weight:800;line-height:1.1}
  #bilan .tete .z{font-size:28px;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
  #bilan .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 4px;border-bottom:1px solid #e3e3e3;font-size:20px}
  #bilan .l span{color:#444}
  #bilan .l b{font-size:24px;text-align:right}
  #bilan .l small{display:block;font-size:13px;color:#777;font-weight:400}
  #bilan .l.g{background:#f4f0fb;border-radius:10px;border-bottom:0;margin-top:10px}
  #bilan .bt2{display:block;width:100%;font-size:19px;font-weight:700;padding:16px;border:0;border-radius:12px;margin-top:14px}
  #sesclose{border:0;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;background:#fff;color:#5e35b1}
#recapbtn{position:absolute;top:8px;left:8px;z-index:1000;background:#fff;padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;border:0;box-shadow:0 1px 4px #0006}
#rtab table{width:100%;border-collapse:collapse;font-size:16px}
#rtab th,#rtab td{padding:12px 8px;border-bottom:1px solid #ddd;text-align:right}
#rtab th:first-child,#rtab td:first-child{text-align:left}
#rtab table.t1 tr:last-child td{font-weight:700}
#rtab table.t2{font-size:13px}
#rtab table.t2 th,#rtab table.t2 td{padding:8px 4px;text-align:center}
#rtab table.t2 th:first-child,#rtab table.t2 td:first-child{text-align:center;font-weight:700}
#rtab table.t2 table.t3{width:100%;font-size:13px;margin:2px 0 8px}
#rtab table.t2 table.t3 th,#rtab table.t2 table.t3 td{padding:6px 4px;text-align:left;font-weight:400;border-bottom:1px solid #eee}
#rtab table.t2 table.t3 th{font-weight:700}
#rtab table.t2 table.t3 td:last-child,#rtab table.t2 table.t3 th:last-child{text-align:right}
#rtab tr.det>td{background:#f7f9fc}
#rtab h4{margin:22px 0 6px;font-size:16px}
#manuel{position:absolute;top:62px;right:10px;z-index:999;background:#fff;border:2px solid #0004;border-radius:6px;padding:6px 8px;font-size:14px;font-weight:700}
#manuel.on{background:#1a73e8;color:#fff}
#aide{display:none;position:absolute;top:100px;left:50%;transform:translateX(-50%);z-index:1000;background:#1a73e8;color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:0 1px 4px #0006;white-space:nowrap}
#zoomhint{display:none;position:absolute;bottom:160px;left:50%;transform:translateX(-50%);z-index:1000;background:#333c;color:#fff;padding:6px 12px;border-radius:10px;font-size:13px;white-space:nowrap}
.eq{background:#fffb;border:0;box-shadow:none;font-weight:700;font-size:12px;padding:1px 5px}
</style>

<body>
<div id="map"></div>
<select id="eqsel"><option value="">Toutes les équipes</option><option value="1">Équipe 1</option><option value="2">Équipe 2</option><option value="3">Équipe 3</option><option value="4">Équipe 4</option><option value="5">Équipe 5</option><option value="6">Équipe 6</option><option value="7">Équipe 7</option><option value="8">Équipe 8</option><option value="9">Équipe 9</option><option value="10">Équipe 10</option><option value="11">Équipe 11</option><option value="12">Équipe 12</option><option value="13">Équipe 13</option></select>
<button id="manuel">➕ Point</button><div id="zoomhint">Zoomez pour afficher les points</div>
<div id="aide">Touchez la carte pour placer le point</div>
<button id="recapbtn">📊 Récap</button>
<div id="sesbar"><div id="sestxt"></div><button id="sesclose">Fermer</button></div>
<div id="recap" style="display:none;position:absolute;inset:0;z-index:3000;background:#fff;overflow:auto">
  <div style="position:sticky;top:0;background:#222;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center"><select id="rsel" style="font-size:16px;padding:6px 8px;max-width:65%"><option value="">Toutes les tournées</option><option value="1">Équipe 1</option><option value="2">Équipe 2</option><option value="3">Équipe 3</option><option value="4">Équipe 4</option><option value="5">Équipe 5</option><option value="6">Équipe 6</option><option value="7">Équipe 7</option><option value="8">Équipe 8</option><option value="9">Équipe 9</option><option value="10">Équipe 10</option><option value="11">Équipe 11</option><option value="12">Équipe 12</option><option value="13">Équipe 13</option></select><button id="rclose" style="font-size:16px;padding:6px 12px">Fermer</button></div>
  <div id="rtab" style="padding:12px"></div>
</div>
<div id="bar">
  <button id="ses">📅 Ouvrir une session de calendrier</button>

  <button id="abs">🚪 Absent</button>

</div>
<div id="smodal"><div class="box">
  <b>Session de calendrier</b>
  <select id="s_t"><option value="">N° de tournée</option><option value="1">Tournée 1</option><option value="2">Tournée 2</option><option value="3">Tournée 3</option><option value="4">Tournée 4</option><option value="5">Tournée 5</option><option value="6">Tournée 6</option><option value="7">Tournée 7</option><option value="8">Tournée 8</option><option value="9">Tournée 9</option><option value="10">Tournée 10</option><option value="11">Tournée 11</option><option value="12">Tournée 12</option><option value="13">Tournée 13</option></select>
  <select id="s_z"><option value="">Ville ou campagne</option><option value="ville">Ville</option><option value="campagne">Campagne</option></select>
  <select id="s_e1"></select>
  <select id="s_e2"></select>
  <select id="s_e3"></select>

</div></div>
<div id="bilan"><div class="in">
  <div class="tete"><small>Bilan de la session</small><div class="t" id="bi-t"></div><div class="z" id="bi-z"></div></div>
  <div class="l"><span>Calendriers réalisés</span><b id="bi-nb"></b></div>
  <div class="l"><span>Espèces<small id="bi-ne"></small></span><b id="bi-esp"></b></div>
  <div class="l"><span>Chèques<small id="bi-nc"></small></span><b id="bi-chq"></b></div>

  <button class="bt2" id="bi-fin" style="background:#2e9e4f;color:#fff">Terminer la session</button>

  <b id="titre">Don reçu</b>

  <div style="position:sticky;top:0;background:#222;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center"><b id="ptitre">Personnes absentes</b><button id="pclose" style="font-size:16px;padding:6px 12px">Fermer</button></div>
  <div id="plist"></div>
</div>

<script>
// Affiche toute erreur en rouge en haut de l'écran (aide au diagnostic)
function erreur(m){const b=document.createElement('div');b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#c00;color:#fff;padding:6px;font-size:12px';b.textContent='Erreur : '+m;document.body.appendChild(b)}
window.onerror=(m,u,l)=>erreur(m+' (ligne '+l+')');
window.addEventListener('unhandledrejection',e=>erreur(String(e.reason)));
if(!window.L){document.body.insertAdjacentHTML('afterbegin','<div style="padding:24px;font:17px sans-serif">La carte n\'a pas pu se charger (problème de connexion). Rechargez la page.</div>');throw new Error('Leaflet non chargé')}
// Mode test : ouvrir l'adresse avec ?test=1 (rien n'est envoyé au Google Sheet)
const TEST=new URLSearchParams(location.search).has('test');
if(TEST)document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.textContent='MODE TEST — rien n\'est envoyé au Sheet';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9998;background:#c00c;color:#fff;text-align:center;font-size:11px;padding:1px;pointer-events:none';document.body.appendChild(b)});
// BETA : écrit dans la COPIE DE TEST du Google Sheet (jamais dans le vrai)
const API = 'https://script.google.com/macros/s/AKfycbyaoNUItVWqDNfh7fyHkCikQBRAYvuIrbMq-oQkg-5eddEHOoGD9YVVduEH-K5BfGvwWQ/exec';
if(!TEST)document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.textContent='BETA v8 — données de la copie de test';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9998;background:#1a73e8cc;color:#fff;text-align:center;font-size:11px;padding:1px;pointer-events:none';document.body.appendChild(b)});
L.Renderer.prototype.options.tolerance=6; // zone de toucher élargie sur téléphone
const map = L.map('map',{preferCanvas:true,zoomControl:false}).setView([44.19, 2.34], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

// Couches des secteurs (fichiers GeoJSON à côté de index.html)
const COUL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#008080','#9a6324','#800000','#808000','#000075'];
// Secteur (équipe) d'un point : croisement avec les polygones
const SECT=[];
const SECT_PRETS=[];   // chargements des secteurs : les adresses attendent qu'ils soient terminés
function dans(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function secteurDe(lng,lat){
  const pt=[lng,lat];
  for(const z of SECT)for(const P of z.polys){
    const b=P.b;if(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3])continue;
    if(dans(pt,P.rings[0])&&!P.rings.slice(1).some(h=>dans(pt,h)))return z;
  }
  return null;
}
function eqPos(lat,lng){const z=secteurDe(lng,lat);return z?{equipe:z.equipe,zone:z.zone}:{equipe:'',zone:''}}
function equipe(a){if(a.eq===undefined&&SECT.length){const z=secteurDe(a.lng,a.lat);a.eq=z?z.equipe:'';a.zone=z?z.zone:''}return a}
function ligneEq(a){equipe(a);return a.eq===undefined?'':(a.eq!==''?`Équipe ${esc(a.eq)} · ${esc(a.zone)}`:'Secteur non défini')}
function secteurs(url,zone){
  const g=L.layerGroup().addTo(map);
  SECT_PRETS.push(fetch(url+'?v='+Date.now()).then(r=>r.json()).then(d=>{
    const feats=(d.features||[]).filter(f=>f.geometry&&f.geometry.coordinates&&f.geometry.coordinates.length&&f.properties&&f.properties.equipe!=null);
    feats.forEach(f=>{const g=f.geometry,P=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];SECT.push({zone,equipe:f.properties.equipe,polys:P.map(rings=>{const xs=rings[0].map(q=>q[0]),ys=rings[0].map(q=>q[1]);return{rings,b:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}})})});
    L.geoJSON({type:'FeatureCollection',features:feats},{
      interactive:false,
      style:f=>{const c=COUL[(f.properties.equipe-1)%COUL.length];return{color:c,weight:2,fillColor:c,fillOpacity:.25}},
      onEachFeature:(f,l)=>l.bindTooltip('Éq. '+f.properties.equipe,{permanent:true,direction:'center',className:'eq'})
    }).addTo(g);
  }).catch(()=>{}));
  return g;
}
const gAdr=L.featureGroup();
const gAdrCtl=L.layerGroup().addTo(map); // case « Adresses » du menu des couches
const FIL={don:L.layerGroup().addTo(map),absent:L.layerGroup().addTo(map),inoccupe:L.layerGroup().addTo(map),refus:L.layerGroup().addTo(map)}; // filtres d'affichage, dans le menu des couches
L.control.layers(null,{'Secteurs campagne':secteurs('secteurs_campagne.geojson','campagne'),'Secteurs ville':secteurs('secteurs_ville.geojson','ville'),'Adresses':gAdrCtl,'💶 Don':FIL.don,'🚪 Absent':FIL.absent,'🏚️ Inoccupé':FIL.inoccupe,'🚫 Refus':FIL.refus},{collapsed:true}).addTo(map);

let pos = null, me = null, first = true, total = 0;
const items = [];
navigator.geolocation.watchPosition(p=>{
  pos = {lat:p.coords.latitude, lng:p.coords.longitude};
  if(!me) me = L.circleMarker(pos,{radius:9,color:'#fff',fillColor:'#1a73e8',fillOpacity:1,weight:3}).addTo(map);
  else me.setLatLng(pos);
  if(first){map.setView(pos,17);first=false}
},()=>alert('Active la localisation'),{enableHighAccuracy:true});

const pts={};
const touched=new Set();
const COLS={don:'#2e9e4f',absent:'#e08a00',inoccupe:'#8e24aa',refus:'#d32f2f',pompier:'#1a73e8',supprimer:'#000'};
const key=r=>r.ida||('p'+r.lat+','+r.lng);
const carre=col=>L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:${col};border:2px solid #fff;box-shadow:0 0 3px #000"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
// Couleur d'un point selon ses logements : orange si un absent, sinon vert si un don, sinon rouge si un refus, sinon bleu si un pompier, sinon violet
const couleurMk=mk=>{const t=Object.values(mk.L).map(r=>r.type);return t.includes('absent')?COLS.absent:t.includes('don')?COLS.don:t.includes('refus')?COLS.refus:t.includes('pompier')?COLS.pompier:t.includes('supprimer')?COLS.supprimer:t.length?COLS.inoccupe:'#777'};
function addMarker(r){
  if(r.lat===''||r.lng===''||r.lat==null||r.lng==null)return;
  const k=key(r),base=k.split('#')[0],n=k.includes('#')?(+k.split('#')[1]||1):1;
  let mk=pts[base];
  if(!mk){
    mk=L.marker([r.lat,r.lng],{icon:carre(COLS[r.type]||COLS.absent)}).addTo(map);
    mk.gps=true;mk.L={};mk.a={id:base,adresse:'',nom:'',lat:r.lat,lng:r.lng,statut:''};
    mk.on('click',()=>showAdr(mk));
    pts[base]=mk;
  }
  const prev=mk.L[n];mk.L[n]=r;
  mk.D=mk.D||{};
  if(r.type==='don'){if(!prev||prev.type!=='don'||!mk.D[n])mk.D[n]=r.date}else delete mk.D[n];
  const col=couleurMk(mk);
  if(mk.gps)mk.setIcon(carre(col));else mk.setStyle({fillColor:col,radius:rayon()});
  if(mk.gps&&r.adresse)mk.a.adresse=r.adresse;
  const i=items.findIndex(x=>key(x.r)===k);if(i>=0)items.splice(i,1);
  items.push({r,mk,n});touched.add(mk);majBtn();applyFilters();
}

// File d'attente (réseau faible sur le terrain)
const getQ=()=>JSON.parse(localStorage.getItem('q')||'[]');
const setQ=q=>localStorage.setItem('q',JSON.stringify(q));
let envoi=false;
async function flush(){
  if(TEST||envoi)return;envoi=true;let ok=true;
  try{
    while(getQ().length){
      const r=getQ()[0];
      await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(r)});
      setQ(getQ().slice(1));
    }
  }catch(e){ok=false}
  envoi=false;
  if(ok&&getQ().length)flush();
}
function save(r){r.date=new Date().toISOString();Object.assign(r,eqPos(r.lat,r.lng));if(SES&&SES.id)r.cal=SES.id;   // id de la session de calendrier
  if(TEST){addMarker(r);return}
 setQ([...getQ(),r]);addMarker(r);flush()}

function needPos(){if(!pos){alert('Position GPS pas encore trouvée');return false}return true}

const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $=id=>document.getElementById(id);

// Session de calendrier (BETA) : tournée, secteur, équipiers et type, gardés sur le téléphone uniquement
let SES=null;
try{SES=JSON.parse(localStorage.getItem('ses')||'null')}catch(e){}
if(SES&&!SES.id){SES=null;try{localStorage.removeItem('ses')}catch(e){}}   // session ouverte avec une ancienne version : à rouvrir
const nomZone=z=>z==='ville'?'Ville':'Campagne';
const TYPES={classique:'Classique',bal:'Boîte aux lettres'};
function majSes(){
  document.body.classList.toggle('ses',!!SES);
  if(SES)$('sestxt').innerHTML=`<div><b>Tournée ${esc(SES.tournee)} · ${nomZone(SES.zone)} · ${esc(TYPES[SES.type]||SES.type)}</b></div><div>${esc(SES.equipiers.join(', '))}</div>`;
}
// Équipiers affectés à chaque tournée (feuille Parametres) : lecture seule, via ?parametres=1 (equipes : t, e1, e2 ; personnel : codes)
let PARAM=null,PERS=[],paramEssai=false;
try{PARAM=JSON.parse(localStorage.getItem('param')||'null')}catch(e){}
try{PERS=JSON.parse(localStorage.getItem('pers')||'[]')}catch(e){}
const EQ_IDS=['s_e1','s_e2','s_e3'];
const listeEq=()=>'<option value="">—</option>'+[...PERS].sort((x,y)=>x.localeCompare(y,'fr')).map(c=>`<option value="${esc(c).replace(/"/g,'&quot;')}">${esc(c)}</option>`).join('');
// Une personne choisie dans une case est grisée dans les deux autres (comme dans le Comptage)
function griserEq(){
  EQ_IDS.forEach(id=>{
    const e=$(id);
    const autres=EQ_IDS.filter(x=>x!==id).map(x=>$(x).value).filter(Boolean);
    [...e.options].forEach(o=>{o.disabled=o.value!==''&&autres.includes(o.value)});
  });
}
function setEq(id,v){
  const e=$(id);v=v||'';
  if(v&&![...e.options].some(o=>o.value===v))e.add(new Option(v,v));
  e.value=v;griserEq();
}
function majListe(){EQ_IDS.forEach(id=>{const e=$(id),v=e.value;e.innerHTML=listeEq();setEq(id,v)})}
EQ_IDS.forEach(id=>{$(id).onchange=griserEq});
let PARAM_ERR='';
function chargerParam(){
  if(paramEssai)return Promise.resolve();
  paramEssai=true;
  const c=new AbortController();setTimeout(()=>c.abort(),8000);
  return fetch(API+'?parametres=1',{signal:c.signal}).then(r=>r.text()).then(txt=>{
    let d;try{d=JSON.parse(txt)}catch(e){PARAM_ERR='réponse illisible : '+txt.slice(0,40).replace(/\s+/g,' ');return}
    const liste=d&&(Array.isArray(d.equipes)?d.equipes:Array.isArray(d.tournees)?d.tournees:null);
    if(!liste){PARAM_ERR='format inattendu ('+(Array.isArray(d)?'liste de '+d.length+' lignes':d&&typeof d==='object'?'clés : '+Object.keys(d).slice(0,6).join(', '):typeof d)+')';return}
    const P={};
    liste.forEach(x=>{
      const a=Array.isArray(x.equipiers)?x.equipiers:[x.e1!=null?x.e1:x.eq1,x.e2!=null?x.e2:x.eq2];
      P[String(x.t)]=a.map(v=>String(v==null?'':v).trim()).filter(Boolean);
    });
    PARAM=P;PARAM_ERR='';
    PERS=(d.personnel||[]).map(x=>String(x.code||x.nom||'').trim()).filter(Boolean);
    try{localStorage.setItem('param',JSON.stringify(P));localStorage.setItem('pers',JSON.stringify(PERS))}catch(e){}
  }).catch(e=>{PARAM_ERR='réseau ('+(e&&e.name||'erreur')+')';paramEssai=false});
}
function remplirEq(){
  const l=(PARAM&&PARAM[$('s_t').value])||[];
  EQ_IDS.forEach(id=>setEq(id,''));
  setEq('s_e1',l[0]);setEq('s_e2',l[1]);   // l'équipier 3 reste libre
}

}

// Bilan de la session : dons enregistrés avec l'id de la session (calendriers, espèces, chèques, moyenne)
function bilanSession(){
  const b={nb:0,esp:0,chq:0,ne:0,nc:0};
  Object.values(pts).forEach(mk=>Object.values(mk.L).forEach(r=>{
    if(r.type!=='don'||r.cal!==SES.id)return;
    const m=Number(r.montant)||0;b.nb++;
    if(r.mode==='Chèque'){b.nc++;b.chq+=m}else{b.ne++;b.esp+=m}
  }));
  b.total=b.esp+b.chq;
  return b;
}

// Signale un point situé dans une autre tournée que celle de la session
function verifTournee(a){
  if(!SECT.length)return true;
  const p=a?{lat:a.lat,lng:a.lng}:pos;
  const z=eqPos(p.lat,p.lng);
  if(String(z.equipe)===String(SES.tournee)&&z.zone===SES.zone)return true;
  const ou=z.equipe!==''?`dans la tournée ${z.equipe} (${z.zone})`:'hors de toutes les tournées tracées';
  return confirm(`⚠️ Ce point est ${ou}, mais la session est la tournée ${SES.tournee} (${SES.zone}).\n\nContinuer quand même ?`);
}

// Adresse automatique (OpenStreetMap / Nominatim)
async function adresse(p){
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),4000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=fr&lat=${p.lat}&lon=${p.lng}`,{signal:c.signal});
    const a=(await r.json()).address||{};
    return [[a.house_number,a.road].filter(Boolean).join(' '),
            a.hamlet||a.isolated_dwelling||a.locality||a.neighbourhood,
            a.village||a.town||a.city||a.municipality].filter(Boolean).join(', ');
  }catch(e){return ''}
}

let cur=null;
function ouvrir(type,a,n,rec){
  if(!SES){alert('Ouvrez d\'abord une session de calendrier');return}
  if(!a&&!needPos())return;
  if(!verifTournee(a))return;
  n=n||1;
  const ida=a?(n>1?a.id+'#'+n:a.id):'';
  if((type==='inoccupe'||type==='supprimer')&&a){save({type,ida,lat:a.lat,lng:a.lng,nom:rec?rec.nom||'':'',adresse:a.adresse,montant:0,mode:'',note:rec?rec.note||'':''});return}
  cur=a?{lat:a.lat,lng:a.lng,type,ida}:{...pos,type};
  ['nom','adresse','montant','note'].forEach(i=>$(i).value='');
  const don=type==='don';
  $('titre').textContent=(don?'Don reçu':type==='refus'?'Refus':type==='pompier'?'Pompier':'Personne absente')+(n>1?' — Logement '+n:'');
  $('montant').style.display=$('mode').style.display=don?'':'none';
  $('modal').style.display='flex';
  $('nom').focus();
  if(a&&!a.manuel){
    $('adresse').value=a.adresse||'';
    if(rec){$('nom').value=rec.nom||'';$('note').value=rec.note||'';if(don&&rec.type==='don'){$('montant').value=rec.montant;$('mode').value=rec.mode||'Espèces'}}
  }else adresse(cur).then(x=>{if(!$('adresse').value)$('adresse').value=x});
}

// Récapitulatif ville / campagne
const fmt=n=>n.toFixed(2).replace('.00','').replace('.',',')+' €';
let OBJ=null; // calendriers de l'année dernière (feuille calendrier2025)
function chargerObj(){return fetch(API+'?objectifs=1').then(r=>r.json()).then(d=>{if(d&&Array.isArray(d.objectifs))OBJ=d.objectifs}).catch(()=>{})}
const ouverts=new Set(); // jours dont le détail est ouvert
const jourLocal=dt=>{const d=new Date(dt);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function rendreRecap(){
  const e=$('rsel').value;
  const R={ville:{real:0,somme:0},campagne:{real:0,somme:0}};
  const zone=a=>{equipe(a);return a.zone&&(!e||String(a.eq)===e)?R[a.zone]:null};
  const J={}; // jour -> dons par zone (équipe choisie)
  const T={};for(let t=1;t<=13;t++)T[t]={ville:0,campagne:0,vo:0,co:0}; // par tournée (toutes les tournées)
  Object.values(pts).forEach(mk=>{
    const z=zone(mk.a);if(!z)return;
    Object.values(mk.L).forEach(r=>{if(r.type==='don'){z.real++;z.somme+=Number(r.montant)||0}});
    if(!e){const t=+mk.a.eq;if(T[t])Object.values(mk.L).forEach(r=>{if(r.type==='don')T[t][mk.a.zone]++})}
    if(e)Object.entries(mk.D||{}).forEach(([n,dt])=>{const k=jourLocal(dt);if(!k)return;const x=J[k]=J[k]||{ville:0,campagne:0,sville:0,scampagne:0,dons:[]};const r=mk.L[n]||{};x[mk.a.zone]++;x['s'+mk.a.zone]+=Number(r.montant)||0;x.dons.push({dt,nom:r.nom,lieu:(mk.a.adresse||r.adresse||'Position GPS')+(+n>1?' · logement '+n:''),m:Number(r.montant)||0})});
  });
  const O={ville:0,campagne:0};
  if(OBJ)OBJ.forEach(x=>{if(!e||String(x.t)===e){O.ville+=Number(x.ville)||0;O.campagne+=Number(x.campagne)||0}if(T[x.t]){T[x.t].vo=Number(x.ville)||0;T[x.t].co=Number(x.campagne)||0}});
  const V=R.ville,C=R.campagne;
  const ligne=(t,a,b,f)=>`<tr><td>${t}</td><td>${f(a)}</td><td>${f(b)}</td><td>${f(a+b)}</td></tr>`;
  const tiret='<td>—</td>';
  const moy=(som,n)=>n?fmt(som/n):'—';
  const ecart=n=>n<0?`<b style="color:#d32f2f">${String(n).replace('-','−')}</b>`:n>0?`<b style="color:#2e9e4f">+${n}</b>`:'0';
  let h='<table class="t1"><tr><th></th><th>Ville</th><th>Campagne</th><th>Total</th></tr>'
    +(OBJ?ligne("Calendriers de l'an dernier",O.ville,O.campagne,String):'<tr><td>Calendriers de l\'an dernier</td>'+tiret+tiret+tiret+'</tr>')
    +ligne('Calendriers réalisés',V.real,C.real,String)
    +(e?`<tr><td>Moyenne par calendrier</td><td>${moy(V.somme,V.real)}</td><td>${moy(C.somme,C.real)}</td><td>${moy(V.somme+C.somme,V.real+C.real)}</td></tr>`:'')
    +(OBJ?ligne('Écart (cette année − an dernier)',V.real-O.ville,C.real-O.campagne,ecart):'<tr><td>Écart (cette année − an dernier)</td>'+tiret+tiret+tiret+'</tr>')
    +'</table><p style="font-size:13px;color:#555">Écart = réalisés cette année − calendriers de l\'an dernier (feuille calendrier2025) ; négatif (rouge) = en retard sur l\'an dernier, positif (vert) = en avance. Réalisés = logements avec don, dans un secteur tracé.</p>';
  if(!e){
    const dif=(a,b)=>OBJ?ecart(a-b):'—';
    h+='<h4>Détail par tournée</h4><div style="overflow-x:auto"><table class="t2"><tr><th>Tournée</th><th>Campagne</th><th>Dif campagne</th><th>Ville</th><th>Dif ville</th><th>Total</th><th>Dif total</th></tr>'
      +Object.keys(T).map(t=>{const x=T[t];return `<tr><td>${t}</td><td>${x.campagne}</td><td>${dif(x.campagne,x.co)}</td><td>${x.ville}</td><td>${dif(x.ville,x.vo)}</td><td>${x.campagne+x.ville}</td><td>${dif(x.campagne+x.ville,x.co+x.vo)}</td></tr>`}).join('')
      +'</table></div>';
  }
  if(e){
    const jours=Object.keys(J).sort().reverse();
    h+=`<h4>Calendriers par jour — Équipe ${esc(e)}</h4>`;
    h+=jours.length?'<div style="overflow-x:auto"><table class="t2"><tr><th>Date</th><th>Ville</th><th>Campagne</th><th>Total</th><th>€ ville</th><th>€ campagne</th><th>€ total</th></tr>'
      +jours.map(k=>{
        const x=J[k],ouvert=ouverts.has(k);
        const det=x.dons.sort((p,q)=>String(p.dt).localeCompare(String(q.dt))).map(d=>`<tr><td>${esc(d.nom)||'(sans nom)'}</td><td>${esc(d.lieu)}</td><td>${fmt(d.m)}</td></tr>`).join('');
        return `<tr data-j="${k}" style="cursor:pointer"><td><b class="fl">${ouvert?'▾':'▸'}</b> ${k.split('-').reverse().join('/')}</td><td>${x.ville}</td><td>${x.campagne}</td><td>${x.ville+x.campagne}</td><td>${fmt(x.sville)}</td><td>${fmt(x.scampagne)}</td><td>${fmt(x.sville+x.scampagne)}</td></tr>`
          +`<tr class="det" style="${ouvert?'':'display:none'}"><td colspan="7"><table class="t3"><tr><th>Nom</th><th>Lieu</th><th>Somme</th></tr>${det}<tr><td colspan="2"><b>Total · ${x.dons.length} calendrier${x.dons.length>1?'s':''}</b></td><td><b>${fmt(x.sville+x.scampagne)}</b></td></tr></table></td></tr>`;
      }).join('')+'</table></div>'
      :'<p style="color:#555">Aucun calendrier enregistré pour l\'instant.</p>';
  }
  $('rtab').innerHTML=h;
}

const statutTxt=r=>(r.type==='don'?r.montant+' € ('+r.mode+')':NOMS[r.type])+(r.note?' — '+r.note:'');
function popupMk(mk,extra){
  const a=mk.a;

  const nums=Object.keys(mk.L).map(Number);

    const bloc=document.createElement('div');
    bloc.style.cssText='margin-top:8px;padding-top:6px;'+(multi?'border-top:1px solid #ddd':'');
    bloc.innerHTML=(multi?`<b>Logement ${n}</b>`:'')+(rec?`${multi?' — ':''}${esc(rec.nom)||'(sans nom)'}<br><small>${esc(statutTxt(rec))}</small><br>`:(multi?'<br>':''));
    // Un don ne peut plus être modifié après le jour où il a été enregistré
    const jr=rec&&rec.type==='don'?jourLocal(rec.date):'';
    if(jr&&jr!==jourLocal(new Date().toISOString())){
      bloc.insertAdjacentHTML('beforeend',`<span style="color:#555">🔒 Don du ${esc(jr.split('-').reverse().join('/'))} — non modifiable</span>`);
      d.appendChild(bloc);return;
    }
    if(!edit){d.appendChild(bloc);return}
    ['don','absent','inoccupe','refus','pompier','supprimer'].filter(t=>!mk.gps||(t!=='inoccupe'&&t!=='pompier'&&t!=='supprimer')).forEach(t=>{
      const act=rec&&rec.type===t,b=document.createElement('button');
      b.textContent=LAB[t];
      b.style.cssText=`margin:4px 4px 0 0;padding:8px 10px;font-size:15px;border:2px solid ${COLS[t]};border-radius:8px;background:${act?COLS[t]:'#fff'};color:${act?'#fff':'#333'}`;
      b.onclick=()=>{
        if(act&&(t==='inoccupe'||t==='supprimer'))return;
        if(rec&&!act&&!confirm('Modifier ce logement ?\n'+(rec.nom||'(sans nom)')+' : '+NOMS[rec.type]+' → '+NOMS[t]))return;
        map.closePopup();ouvrir(t,a,n,rec);
      };
      bloc.appendChild(b);
    });
    d.appendChild(bloc);
  });
  if(edit&&Object.keys(mk.L).length&&!extra){
    const b=document.createElement('button');
    b.textContent='➕ Ajouter un logement';
    b.style.cssText='margin-top:10px;padding:8px 10px;font-size:15px;width:100%;border:2px dashed #1a73e8;border-radius:8px;background:#fff;color:#1a73e8';
    b.onclick=()=>showAdr(mk,Math.max(...Object.keys(mk.L).map(Number))+1);
    d.appendChild(b);
  }
  return d;
}
function showAdr(mk,extra){if(placement)stopPlacement();L.popup({maxHeight:320}).setLatLng(mk.getLatLng()).setContent(popupMk(mk,extra)).openOn(map)}
gAdr.on('click',e=>showAdr(e.layer));
function chargerAdresses(){
  return fetch('adresses.geojson?v='+Date.now()).then(r=>r.json()).then(d=>{
    d.features.forEach(f=>{
      const [lng,lat]=f.geometry.coordinates;
      if(SECT.length&&!secteurDe(lng,lat))return;   // adresse hors de toute tournée : point non chargé (si les secteurs n'ont pas pu être lus, on garde tout)
      const a={id:f.properties.id,adresse:f.properties.adr,nom:'',lat,lng,statut:''};
      const mk=L.circleMarker([lat,lng],{radius:rayon(),color:'#fff',weight:1,fillColor:'#777',fillOpacity:.9}).addTo(gAdr);
      mk.a=a;mk.L={};pts[a.id]=mk;
    });
  }).catch(()=>{});
}
// Chargement initial puis actualisation automatique (1 min) des saisies des autres
let vus=0,encours=false;
const traiter=rows=>rows.forEach(r=>{try{addMarker(r)}catch(e){}});
Promise.all([Promise.all(SECT_PRETS).then(chargerAdresses),fetch(API).then(r=>r.json()).catch(()=>[])]).then(([_,rows])=>{rows=Array.isArray(rows)?rows:[];vus=rows.reduce((m,r)=>Math.max(m,Number(r.maj)||0),0);traiter(rows)});
function actualiser(){
  if(encours||document.hidden||!navigator.onLine)return;
  encours=true;flush();
  fetch(API+'?depuis='+vus).then(r=>r.json()).then(d=>{
    if(!d||typeof d.n!=='number')return;
    traiter(d.rows||[]);traiter(getQ());vus=d.n;
  }).catch(()=>{}).finally(()=>{encours=false});
}
setInterval(actualiser,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)actualiser()});
majSes();
majZoom();
flush();
window.addEventListener('online',flush);
</script>
