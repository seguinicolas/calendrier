<select id="eqsel"><option value="">Toutes les équipes</option><option value="1">Équipe 1</option><option value="2">Équipe 2</option><option value="3">Équipe 3</option><option value="4">Équipe 4</option><option value="5">Équipe 5</option><option value="6">Équipe 6</option><option value="7">Équipe 7</option><option value="8">Équipe 8</option><option value="9">Équipe 9</option><option value="10">Équipe 10</option><option value="11">Équipe 11</option><option value="12">Équipe 12</option><option value="13">Équipe 13</option></select>
<button id="manuel">➕ Point</button><div id="zoomhint">Zoomez pour afficher les points</div>

  <div id="plist"></div>

<script>
// Affiche toute erreur en rouge en haut de l'écran (aide au diagnostic)
function erreur(m){const b=document.createElement('div');b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#c00;color:#fff;padding:6px;font-size:12px';b.textContent='Erreur : '+m;document.body.appendChild(b)}
window.onerror=(m,u,l)=>erreur(m+' (ligne '+l+')');
window.addEventListener('unhandledrejection',e=>erreur(String(e.reason)));
if(!window.L){document.body.insertAdjacentHTML('afterbegin','<div style="padding:24px;font:17px sans-serif">La carte n\'a pas pu se charger (problème de connexion). Rechargez la page.</div>');throw new Error('Leaflet non chargé')}
// Mode test : ouvrir l'adresse avec ?test=1 (rien n'est envoyé au Google Sheet)
const TEST=new URLSearchParams(location.search).has('test');
if(TEST)document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.textContent='MODE TEST — rien n\'est envoyé au Sheet';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9998;background:#c00c;color:#fff;text-align:center;font-size:11px;padding:1px;pointer-events:none';document.body.appendChild(b)});
const API = 'https://script.google.com/macros/s/AKfycbz6sD97H6fMLxV-n2gB4K6FJxnXZ2hwUHgYRKAdmNq24JG4keXBx4CUSFXJyjSODCkPlw/exec';
L.Renderer.prototype.options.tolerance=6; // zone de toucher élargie sur téléphone
const map = L.map('map',{preferCanvas:true}).setView([44.19, 2.34], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

// Couches des secteurs (fichiers GeoJSON à côté de index.html)
const COUL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#008080','#9a6324','#800000','#808000','#000075'];
// Secteur (équipe) d'un point : croisement avec les polygones
const SECT=[];
function dans(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function secteurDe(lng,lat){
  const pt=[lng,lat];
  for(const z of SECT)for(const P of z.polys){
    const b=P.b;if(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3])continue;
    if(dans(pt,P.rings[0])&&!P.rings.slice(1).some(h=>dans(pt,h)))return z;
  }
  return null;
}
function eqPos(lat,lng){const z=secteurDe(lng,lat);return z?{equipe:z.equipe,zone:z.zone}:{equipe:'',zone:''}}
function equipe(a){if(a.eq===undefined&&SECT.length){const z=secteurDe(a.lng,a.lat);a.eq=z?z.equipe:'';a.zone=z?z.zone:''}return a}
function ligneEq(a){equipe(a);return a.eq===undefined?'':(a.eq!==''?`Équipe ${esc(a.eq)} · ${esc(a.zone)}`:'Secteur non défini')}
function secteurs(url,zone){
  const g=L.layerGroup().addTo(map);
  fetch(url+'?v='+Date.now()).then(r=>r.json()).then(d=>{
    const feats=(d.features||[]).filter(f=>f.geometry&&f.geometry.coordinates&&f.geometry.coordinates.length&&f.properties&&f.properties.equipe!=null);
    feats.forEach(f=>{const g=f.geometry,P=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];SECT.push({zone,equipe:f.properties.equipe,polys:P.map(rings=>{const xs=rings[0].map(q=>q[0]),ys=rings[0].map(q=>q[1]);return{rings,b:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}})})});
    L.geoJSON({type:'FeatureCollection',features:feats},{
      interactive:false,
      style:f=>{const c=COUL[(f.properties.equipe-1)%COUL.length];return{color:c,weight:2,fillColor:c,fillOpacity:.25}},
      onEachFeature:(f,l)=>l.bindTooltip('Éq. '+f.properties.equipe,{permanent:true,direction:'center',className:'eq'})
    }).addTo(g);
  }).catch(()=>{});
  return g;
}
const gAdr=L.featureGroup();
const gAdrCtl=L.layerGroup().addTo(map); // case « Adresses » du menu des couches
L.control.layers(null,{'Secteurs campagne':secteurs('secteurs_campagne.geojson','campagne'),'Secteurs ville':secteurs('secteurs_ville.geojson','ville'),'Adresses':gAdrCtl},{collapsed:true}).addTo(map);

let pos = null, me = null, first = true, total = 0;
const items = [];
// (admin : pas de géolocalisation)

const pts={};
const touched=new Set();
const COLS={don:'#2e9e4f',absent:'#e08a00',inoccupe:'#8e24aa'};
const key=r=>r.ida||('p'+r.lat+','+r.lng);
const carre=col=>L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:${col};border:2px solid #fff;box-shadow:0 0 3px #000"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
// Couleur d'un point selon ses logements : orange si un absent, sinon vert si un don, sinon violet
const couleurMk=mk=>{const t=Object.values(mk.L).map(r=>r.type);return t.includes('absent')?COLS.absent:t.includes('don')?COLS.don:t.length?COLS.inoccupe:'#777'};
function addMarker(r){
  if(r.lat===''||r.lng===''||r.lat==null||r.lng==null)return;
  const k=key(r),base=k.split('#')[0],n=k.includes('#')?(+k.split('#')[1]||1):1;
  let mk=pts[base];
  if(!mk){
    mk=L.marker([r.lat,r.lng],{icon:carre(COLS[r.type]||COLS.absent)}).addTo(map);
    mk.gps=true;mk.L={};mk.a={id:base,adresse:'',nom:'',lat:r.lat,lng:r.lng,statut:''};
    mk.on('click',()=>showAdr(mk));
    pts[base]=mk;
  }
  const prev=mk.L[n];mk.L[n]=r;
  mk.D=mk.D||{};
  if(r.type==='don'){if(!prev||prev.type!=='don'||!mk.D[n])mk.D[n]=r.date}else delete mk.D[n];
  const col=couleurMk(mk);
  if(mk.gps)mk.setIcon(carre(col));else mk.setStyle({fillColor:col,radius:8});
  if(mk.gps&&r.adresse)mk.a.adresse=r.adresse;
  const i=items.findIndex(x=>key(x.r)===k);if(i>=0)items.splice(i,1);
  items.push({r,mk,n});touched.add(mk);majBtn();applyFilters();
}

let envoi=false;
async function flush(){
  return; // admin : lecture seule, aucun envoi
  if(TEST||envoi)return;envoi=true;let ok=true;
  try{
    while(getQ().length){
      const r=getQ()[0];
      await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(r)});
      setQ(getQ().slice(1));
    }
  }catch(e){ok=false}
  envoi=false;
  if(ok&&getQ().length)flush();
}
function save(r){r.date=new Date().toISOString();Object.assign(r,eqPos(r.lat,r.lng));

// Adresse automatique (OpenStreetMap / Nominatim)
async function adresse(p){
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),4000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=fr&lat=${p.lat}&lon=${p.lng}`,{signal:c.signal});
    const a=(await r.json()).address||{};
    return [[a.house_number,a.road].filter(Boolean).join(' '),
            a.hamlet||a.isolated_dwelling||a.locality||a.neighbourhood,
            a.village||a.town||a.city||a.municipality].filter(Boolean).join(', ');
  }catch(e){return ''}
}

let cur=null;
function ouvrir(type,a,n,rec){
  if(!a&&!needPos())return;
  n=n||1;
  const ida=a?(n>1?a.id+'#'+n:a.id):'';
  if(type==='inoccupe'&&a){save({type:'inoccupe',ida,lat:a.lat,lng:a.lng,nom:rec?rec.nom||'':'',adresse:a.adresse,montant:0,mode:'',note:rec?rec.note||'':''});return}
  cur=a?{lat:a.lat,lng:a.lng,type,ida}:{...pos,type};
  ['nom','adresse','montant','note'].forEach(i=>$(i).value='');
  const don=type==='don';
  $('titre').textContent=(don?'Don reçu':'Personne absente')+(n>1?' — Logement '+n:'');
  $('montant').style.display=$('mode').style.display=don?'':'none';
  $('modal').style.display='flex';
  $('nom').focus();
  if(a&&!a.manuel){
    $('adresse').value=a.adresse||'';
    if(rec){$('nom').value=rec.nom||'';$('note').value=rec.note||'';if(don&&rec.type==='don'){$('montant').value=rec.montant;$('mode').value=rec.mode||'Espèces'}}
  }else adresse(cur).then(x=>{if(!$('adresse').value)$('adresse').value=x});
}

const fmt=n=>n.toFixed(2).replace('.00','').replace('.',',')+' €';
let OBJ=null,OBJ_ANNEE=''; // calendriers de l'année à comparer (feuille Historique)
function chargerObj(){return fetch(API+'?objectifs=1').then(r=>r.json()).then(d=>{if(d&&Array.isArray(d.objectifs)){OBJ=d.objectifs;OBJ_ANNEE=d.annee||''}}).catch(()=>{})}

const jourLocal=dt=>{const d=new Date(dt);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function rendreRecap(){
  const e=$('rsel').value;
  const R={ville:{real:0,somme:0},campagne:{real:0,somme:0}};
  const zone=a=>{equipe(a);return a.zone&&(!e||String(a.eq)===e)?R[a.zone]:null};
  const J={}; // jour -> dons par zone (équipe choisie)
  const T={};for(let t=1;t<=13;t++)T[t]={ville:0,campagne:0,vo:0,co:0}; // par tournée (toutes les tournées)
  Object.values(pts).forEach(mk=>{
    const z=zone(mk.a);if(!z)return;
    Object.values(mk.L).forEach(r=>{if(r.type==='don'){z.real++;z.somme+=Number(r.montant)||0}});
    if(!e){const t=+mk.a.eq;if(T[t])Object.values(mk.L).forEach(r=>{if(r.type==='don')T[t][mk.a.zone]++})}
    if(e)Object.entries(mk.D||{}).forEach(([n,dt])=>{const k=jourLocal(dt);if(!k)return;const x=J[k]=J[k]||{ville:0,campagne:0,sville:0,scampagne:0,dons:[]};const r=mk.L[n]||{};x[mk.a.zone]++;x['s'+mk.a.zone]+=Number(r.montant)||0;x.dons.push({dt,nom:r.nom,lieu:(mk.a.adresse||r.adresse||'Position GPS')+(+n>1?' · logement '+n:''),m:Number(r.montant)||0})});
  });
  const O={ville:0,campagne:0};
  if(OBJ)OBJ.forEach(x=>{if(!e||String(x.t)===e){O.ville+=Number(x.ville)||0;O.campagne+=Number(x.campagne)||0}if(T[x.t]){T[x.t].vo=Number(x.ville)||0;T[x.t].co=Number(x.campagne)||0}});
  const V=R.ville,C=R.campagne;
  const ligne=(t,a,b,f)=>`<tr><td>${t}</td><td>${f(a)}</td><td>${f(b)}</td><td>${f(a+b)}</td></tr>`;
  const tiret='<td>—</td>';
  const moy=(som,n)=>n?fmt(som/n):'—';
  const ecart=n=>n<0?`<b style="color:#d32f2f">${String(n).replace('-','−')}</b>`:n>0?`<b style="color:#2e9e4f">+${n}</b>`:'0';
  let h='<table class="t1"><tr><th></th><th>Ville</th><th>Campagne</th><th>Total</th></tr>'
    +(OBJ?ligne("Calendriers de l'an dernier",O.ville,O.campagne,String):'<tr><td>Calendriers de l\'an dernier</td>'+tiret+tiret+tiret+'</tr>')
    +ligne('Calendriers réalisés',V.real,C.real,String)
    +(e?`<tr><td>Moyenne par calendrier</td><td>${moy(V.somme,V.real)}</td><td>${moy(C.somme,C.real)}</td><td>${moy(V.somme+C.somme,V.real+C.real)}</td></tr>`:'')
    +(OBJ?ligne('Écart (cette année − an dernier)',V.real-O.ville,C.real-O.campagne,ecart):'<tr><td>Écart (cette année − an dernier)</td>'+tiret+tiret+tiret+'</tr>')
    +'</table><p style="font-size:13px;color:#555">Écart = réalisés cette année − calendriers de l\'an dernier (feuille Historique'+(OBJ_ANNEE?', année '+OBJ_ANNEE:'')+') ; négatif (rouge) = en retard sur l\'an dernier, positif (vert) = en avance. Réalisés = logements avec don, dans un secteur tracé.</p>';
  if(!e){
    const dif=(a,b)=>OBJ?ecart(a-b):'—';
    h+='<h4>Détail par tournée</h4><div style="overflow-x:auto"><table class="t2"><tr><th>Tournée</th><th>Campagne</th><th>Dif campagne</th><th>Ville</th><th>Dif ville</th><th>Total</th><th>Dif total</th></tr>'
      +Object.keys(T).map(t=>{const x=T[t];return `<tr><td>${t}</td><td>${x.campagne}</td><td>${dif(x.campagne,x.co)}</td><td>${x.ville}</td><td>${dif(x.ville,x.vo)}</td><td>${x.campagne+x.ville}</td><td>${dif(x.campagne+x.ville,x.co+x.vo)}</td></tr>`}).join('')
      +'</table></div>';
  }
  if(e){
    const jours=Object.keys(J).sort().reverse();
    h+=`<h4>Calendriers par jour — Équipe ${esc(e)}</h4>`;
    h+=jours.length?'<div style="overflow-x:auto"><table class="t2"><tr><th>Date</th><th>Ville</th><th>Campagne</th><th>Total</th><th>€ ville</th><th>€ campagne</th><th>€ total</th></tr>'
      +jours.map(k=>{
        const x=J[k],ouvert=ouverts.has(k);
        const det=x.dons.sort((p,q)=>String(p.dt).localeCompare(String(q.dt))).map(d=>`<tr><td>${esc(d.nom)||'(sans nom)'}</td><td>${esc(d.lieu)}</td><td>${fmt(d.m)}</td></tr>`).join('');
        return `<tr data-j="${k}" style="cursor:pointer"><td><b class="fl">${ouvert?'▾':'▸'}</b> ${k.split('-').reverse().join('/')}</td><td>${x.ville}</td><td>${x.campagne}</td><td>${x.ville+x.campagne}</td><td>${fmt(x.sville)}</td><td>${fmt(x.scampagne)}</td><td>${fmt(x.sville+x.scampagne)}</td></tr>`
          +`<tr class="det" style="${ouvert?'':'display:none'}"><td colspan="7"><table class="t3"><tr><th>Nom</th><th>Lieu</th><th>Somme</th></tr>${det}<tr><td colspan="2"><b>Total · ${x.dons.length} calendrier${x.dons.length>1?'s':''}</b></td><td><b>${fmt(x.sville+x.scampagne)}</b></td></tr></table></td></tr>`;
      }).join('')+'</table></div>'
      :'<p style="color:#555">Aucun calendrier enregistré pour l\'instant.</p>';
  }
  $('rtab').innerHTML=h;
}

async function rendreEquipe(){

  try{
    const d=await fetch(API+'?recapequipe=1&t='+Date.now()).then(r=>r.json());
    if(d&&Array.isArray(d.rows)&&d.rows.length&&'ville' in d.rows[0])rows=d.rows;
  }catch(e){}
  const branche=!!rows;
  if(!rows){ // lecture de la feuille pas encore branchée : mise en page avec les équipes de Parametres
    try{if(!PARAM_REF)await chargerParametres()}catch(e){}
    const vide={nbr:null,diff:null,moy:null};
    rows=PARAM_REF?[...PARAM_REF.equipes].sort((a,b)=>a.t-b.t).map(q=>({t:q.t,secteur:q.nom,e1:q.e1,e2:q.e2,ville:vide,campagne:vide,total:vide})):[];
  }
  if(!$('equipe'))return; // on a changé d'onglet entre-temps
  const nb=v=>v===null||v===undefined?(branche?'':'—'):v;
  const mo=v=>v===null||v===undefined?(branche?'':'—'):fmt(v);

    +'<tr><th colspan="4"></th><th colspan="3">Ville</th><th colspan="3">Campagne</th><th colspan="3">Total</th></tr>'
    +'<tr><th>Tournée</th><th>Secteur</th><th>Équipier 1</th><th>Équipier 2</th>'+'<th>Nbr</th><th>Diff</th><th>Moy</th>'.repeat(3)+'</tr>'
    +rows.map(r=>`<tr><td>${esc(r.t)}</td><td>${esc(r.secteur)}</td><td>${esc(r.e1)}</td><td>${esc(r.e2)}</td>${tri(r.ville)}${tri(r.campagne)}${tri(r.total)}</tr>`).join('')
    +'</table></div>'
    +(branche?'':'<p class="note">Mise en page seule pour l\'instant : les chiffres apparaîtront quand la lecture de la feuille Recap_equipe sera branchée.</p>');
}
// Récapitulatif individuel : reproduit la feuille Recap_pers (Nom · Fait · Reste à faire)
async function rendreIndiv(){
  let rows=null;
  try{
    const d=await fetch(API+'?recappers=1&t='+Date.now()).then(r=>r.json());
    if(d&&Array.isArray(d.rows)&&d.rows.length&&'fait' in d.rows[0])rows=d.rows;
  }catch(e){}
  const branche=!!rows;
  if(!rows){ // lecture de la feuille pas encore branchée : on affiche la mise en page avec le personnel de Parametres
    try{if(!PARAM_REF)await chargerParametres()}catch(e){}
    rows=PARAM_REF?[...PARAM_REF.personnel].sort((a,b)=>a.code.localeCompare(b.code,'fr')).map(p=>({nom:p.code,fait:null,reste:null})):[];
  }
  if(!$('indiv'))return; // on a changé d'onglet entre-temps
  rows=rows.filter(r=>String(r.nom||'').trim()!=='');
  const cell=v=>v===null||v===undefined?'—':v;
  // la feuille a deux blocs côte à côte (champ « bloc ») ; sinon on coupe la liste en deux
  const nb=Math.ceil(rows.length/2);
  const gauche=rows.some(r=>r.bloc)?rows.filter(r=>r.bloc===1):rows.slice(0,nb);
  const droite=rows.some(r=>r.bloc)?rows.filter(r=>r.bloc===2):rows.slice(nb);
  const bloc=L=>`<table class="cpt ind"><tr><th>Nom</th><th>Fait</th><th>Reste à faire</th></tr>${L.map(r=>`<tr><td>${esc(r.nom)}</td><td>${cell(r.fait)}</td><td>${cell(r.reste)}</td></tr>`).join('')}</table>`;
  $('indiv').innerHTML='<h4 style="margin:4px 0 10px">Décompte des calendriers par personne</h4>'
    +'<div class="indiv2">'+bloc(gauche)+bloc(droite)+'</div>'
    +(branche?'':'<p class="note">Mise en page seule pour l\'instant : les chiffres « Fait » et « Reste à faire » apparaîtront quand la lecture de la feuille Recap_pers sera branchée.</p>');
}

// Export : une couche (GeoJSON) avec tous les points d'adresse et leur statut — sans noms ni montants
function exporterCouche(){
  const feats=[];
  Object.values(pts).forEach(mk=>{
    const a=equipe(mk.a),rs=Object.values(mk.L),nb=t=>rs.filter(r=>r.type===t).length;
    const statut=!rs.length?'non renseigné':nb('absent')?'absent':nb('don')?'don':'inoccupé';
    const jours=rs.map(r=>jourLocal(r.date)).filter(Boolean).sort();
    feats.push({type:'Feature',
      properties:{id:a.id,adresse:a.adresse||'',statut,logements:rs.length,dons:nb('don'),absents:nb('absent'),inoccupes:nb('inoccupe'),
        equipe:a.eq===undefined||a.eq===''?null:a.eq,zone:a.zone||'',derniere_saisie:jours.length?jours[jours.length-1]:'',source:mk.gps?'position':'adresse'},
      geometry:{type:'Point',coordinates:[a.lng,a.lat]}});
  });
  const blob=new Blob([JSON.stringify({type:'FeatureCollection',features:feats})],{type:'application/geo+json'});
  const url=URL.createObjectURL(blob),lien=document.createElement('a');
  lien.href=url;lien.download='habitations_'+jourLocal(new Date().toISOString())+'.geojson';
  document.body.appendChild(lien);lien.click();lien.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

// ---- Comptage : une ligne par jour, par tournée et par secteur (ville / campagne)
function lignesComptage(){
  const G={};
  Object.values(pts).forEach(mk=>{
    const a=equipe(mk.a);
    Object.entries(mk.D||{}).forEach(([n,dt])=>{
      const r=mk.L[n];if(!r||r.type!=='don')return;
      const jour=jourLocal(dt);if(!jour)return;
      const t=a.eq===undefined||a.eq===''?'':a.eq,z=a.zone||'';
      const cle=jour+'|'+(t===''?'99':String(t).padStart(2,'0'))+'|'+(z==='ville'?'1':z==='campagne'?'2':'3');
      const g=G[cle]=G[cle]||{jour,t,z,n:0,s:0};
      g.n++;g.s+=Number(r.montant)||0;
    });
  });
  // date la plus récente en premier, puis tournée, puis ville avant campagne
  return Object.keys(G).sort((x,y)=>{const[a,b]=[x.split('|'),y.split('|')];return b[0].localeCompare(a[0])||a[1].localeCompare(b[1])||a[2].localeCompare(b[2])}).map(k=>G[k]);
}

const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const tourneesDe=code=>PARAM.equipes.filter(e=>e.e1===code||e.e2===code).map(e=>e.t);
// Code d'une nouvelle personne : Nom + initiale du prénom ; 2 lettres (puis 3…) si déjà pris ; un numéro si nom ET prénom identiques
function nouveauCode(nom,prenom){
  const pris=new Set(PARAM.personnel.map(p=>norm(p.code)));
  const N=nom.trim(),P=prenom.trim();
  for(let k=1;k<=P.length;k++){
    const c=N+' '+P.charAt(0).toUpperCase()+P.slice(1,k).toLowerCase();
    if(!pris.has(norm(c)))return c;
  }
  let n=2;while(pris.has(norm(N+' '+P+' '+n)))n++;
  return N+' '+P+' '+n;
}
// Anomalies dans les affectations : même personne sur plusieurs tournées, ou nom absent de la liste du personnel
function conflits(){
  const msg=[],vus={},connus=new Set(PARAM.personnel.map(p=>p.code));
  PARAM.equipes.forEach(e=>[e.e1,e.e2].forEach(c=>{if(c)(vus[c]=vus[c]||[]).push(e.t)}));
  Object.keys(vus).forEach(c=>{
    const t=[...new Set(vus[c])];
    if(!connus.has(c))msg.push(`« ${c} » (tournée ${t.join(', ')}) n'existe pas dans la liste du personnel.`);
    if(vus[c].length>1)msg.push(t.length>1?`${c} est affecté(e) à plusieurs tournées : ${t.join(' et ')}.`:`${c} est équipier 1 et équipier 2 de la tournée ${t[0]}.`);
  });
  return msg;
}

// Liste déroulante : une personne déjà affectée à une AUTRE tournée est grisée ; l'autre équipier de la tournée aussi
function optionsPers(sel,autre,t){
  const liste=[...PARAM.personnel].sort((a,b)=>a.code.localeCompare(b.code,'fr'));
  const connus=new Set(liste.map(p=>p.code));
  return '<option value="">— aucun —</option>'
    +(sel&&!connus.has(sel)?`<option value="${esc(sel)}" selected>⚠ ${esc(sel)} (absent de la liste)</option>`:'')
    +liste.map(p=>{
      const ailleurs=tourneesDe(p.code).filter(x=>x!==t);
      const off=(autre&&p.code===autre)||(ailleurs.length&&p.code!==sel);
      return `<option value="${esc(p.code)}"${p.code===sel?' selected':''}${off?' disabled':''}>${esc(p.code)}${ailleurs.length?` (tournée ${ailleurs.join(', ')})`:''}</option>`;
    }).join('');
}
function rendrePersonnel(){majBarre();
  const liste=[...PARAM.personnel].sort((a,b)=>a.code.localeCompare(b.code,'fr'));
  const sans=liste.filter(p=>!tourneesDe(p.code).length).length;
  $('po').innerHTML=`<div class="barre-ajout">
      <input id="p-nom" placeholder="Nom (ex. Durand)"><input id="p-prenom" placeholder="Prénom"><button class="bt" id="p-ajouter">➕ Ajouter</button>
    </div>
    <p id="p-msg" class="note"></p>
    <table class="cpt"><tr><th>Nom</th><th>Prénom</th><th>Tournée</th><th></th></tr>
    ${liste.map(p=>{const t=tourneesDe(p.code);return `<tr><td style="text-align:left">${esc(p.nom)}</td><td style="text-align:left">${esc(p.prenom)}</td><td>${t.length?t.join(', '):'—'}</td><td><button class="sup" data-code="${esc(p.code)}">🗑 Supprimer</button></td></tr>`}).join('')}
    </table>
    <p class="note">${liste.length} personnes · ${sans} sans équipe (c'est normal). Le code (nom + initiale du prénom) est créé automatiquement et ne change plus ensuite.</p>`;
  $('p-ajouter').onclick=()=>{
    const nom=$('p-nom').value.trim(),prenom=$('p-prenom').value.trim();
    if(!nom||!prenom){msgParam('Renseigne le nom et le prénom.',true);return}
    const code=nouveauCode(nom,prenom);
    PARAM.personnel.push({nom,prenom,code});rendrePersonnel();msgParam('✔ '+code+' ajouté(e) : pense à Enregistrer.');
  };
  $('po').querySelectorAll('button.sup').forEach(b=>b.onclick=()=>{
    const code=b.dataset.code,t=tourneesDe(code);
    const q=t.length?`${code} est équipier de la tournée ${t.join(', ')}. Sa place sera vidée. Supprimer ?`:`Supprimer ${code} ?`;
    if(!confirm(q))return;
    PARAM.personnel=PARAM.personnel.filter(p=>p.code!==code);
    PARAM.equipes.forEach(e=>{if(e.e1===code)e.e1='';if(e.e2===code)e.e2=''});
    rendrePersonnel();msgParam(code+' supprimé(e) : pense à Enregistrer.');
  });
}
function rendreDivers(){majBarre();
  const an=PARAM.annees||[],cur=PARAM.annee||'';
  $('po').innerHTML=`<table class="cpt"><tr><th>Réglage</th><th>Valeur</th></tr>
    <tr><td style="text-align:left">Année à comparer<br><span class="note">Dans le récapitulatif, l'écart = réalisés cette année − calendriers de l'année choisie (feuille Historique).</span></td>
    <td><select id="d-annee">${an.length?an.map(a=>`<option value="${esc(a)}"${a===cur?' selected':''}>${esc(a)}</option>`).join(''):'<option value="">Aucune année trouvée</option>'}</select></td></tr></table>
    <p class="note">Les années proposées sont celles des colonnes de la feuille Historique (2025_C, 2025_V, 2026_C…).</p>`;
  $('d-annee').onchange=ev=>{PARAM.annee=ev.target.value;majBarre()};
}
function rendreEquipes(){majBarre();
  const cf=conflits();
  $('po').innerHTML=(cf.length?`<div style="background:#ffeaea;border:1px solid #d9a0a0;border-radius:6px;padding:8px 12px;margin:8px 0;color:#b71c1c;font-size:14px"><b>⚠ À corriger avant de pouvoir enregistrer :</b><br>${cf.map(esc).join('<br>')}</div>`:'')
    +`<table class="cpt"><tr><th>Tournée</th><th>Nom de la tournée</th><th>Équipier 1</th><th>Équipier 2</th></tr>
    ${PARAM.equipes.map((e,i)=>`<tr data-i="${i}"><td>${e.t}</td><td><input class="e-nom" value="${esc(e.nom)}"></td><td><select class="e-s1">${optionsPers(e.e1,e.e2,e.t)}</select></td><td><select class="e-s2">${optionsPers(e.e2,e.e1,e.t)}</select></td></tr>`).join('')}
    </table>
    <p class="note">Une personne ne peut être affectée qu'à une seule tournée, et pas deux fois dans la même : les noms déjà pris sont grisés avec leur numéro de tournée. ⚠ signale un nom qui n'existe pas dans la liste du personnel.</p>`;
  $('po').querySelectorAll('tr[data-i]').forEach(tr=>{
    const e=PARAM.equipes[+tr.dataset.i];
    tr.querySelector('.e-nom').oninput=ev=>{e.nom=ev.target.value;majBarre()};
    tr.querySelector('.e-s1').onchange=ev=>{e.e1=ev.target.value;rendreEquipes()};
    tr.querySelector('.e-s2').onchange=ev=>{e.e2=ev.target.value;rendreEquipes()};
  });
}
function ouvrirParametres(onglet){
  if(!PARAM){
    panneau('<p class="note">Chargement des paramètres…</p>');
    chargerParametres().then(()=>ouvrirParametres(onglet)).catch(()=>{
      panneau('<p class="note" style="color:#c62828;font-weight:700">Impossible de lire la feuille Parametres.</p><button class="bt" id="p-retry">Réessayer</button>');
      $('p-retry').onclick=()=>ouvrirParametres(onglet);
    });
    return;
  }
  ONGLET=onglet||ONGLET;
  const adr=Object.values(pts).filter(m=>!m.gps).length;
  panneau(`<div class="pbox"><h3 style="margin-top:0">Paramètres</h3>
    <div class="onglets"><button data-o="pers" class="${ONGLET==='pers'?'on':''}">Personnel</button><button data-o="eq" class="${ONGLET==='eq'?'on':''}">Équipes</button><button data-o="div" class="${ONGLET==='div'?'on':''}">Divers</button></div>
    <p class="apercu">Données réelles de la feuille Parametres. Les modifications ne sont envoyées au Google Sheet qu'en appuyant sur Enregistrer.</p>
    <div id="po"></div><div id="p-bar"></div>
    <p class="note" style="margin-top:22px">Informations : ${adr} adresses chargées, ${items.length} logements saisis, ${Object.keys(pts).length-adr} point(s) hors adresse.</p></div>`,true);
  $('apanel').querySelectorAll('.onglets button').forEach(b=>b.onclick=()=>ouvrirParametres(b.dataset.o));
  rendreOnglet();
}
$('ab-param').onclick=()=>ouvrirParametres();



const clicRecap=e=>{
  const tr=e.target.closest&&e.target.closest('tr[data-j]');if(!tr)return;
  const det=tr.nextElementSibling,k=tr.dataset.j,ouvre=det.style.display==='none';
  det.style.display=ouvre?'':'none';ouvre?ouverts.add(k):ouverts.delete(k);
  tr.querySelector('.fl').textContent=ouvre?'▾':'▸';
};
$('recapbtn').onclick=recap;

// Point manuel (placé sur la carte sans être sur place)
let placement=false;
function stopPlacement(){placement=false;$('manuel').classList.remove('on');$('aide').style.display='none';map.getContainer().style.cursor=''}
$('manuel').onclick=()=>{
  if(placement){stopPlacement();return}
  placement=true;$('manuel').classList.add('on');$('aide').style.display='block';
  map.getContainer().style.cursor='crosshair';map.closePopup();
};
map.on('click',e=>{
  if(!placement)return;
  stopPlacement();
  const a={id:'',adresse:'',nom:'',lat:e.latlng.lat,lng:e.latlng.lng,statut:'',manuel:true};
  L.popup().setLatLng(e.latlng).setContent(popupAdr(a,true)).openOn(map);
});

// Affichage selon l'échelle : points et carrés visibles à partir du zoom ZMIN
const ZMIN=15;
const zoomOk=()=>map.getZoom()>=ZMIN;
function majAdr(){(map.hasLayer(gAdrCtl)&&zoomOk())?map.addLayer(gAdr):map.removeLayer(gAdr)}
function majZoom(){$('zoomhint').style.display=zoomOk()?'none':'block';majAdr();applyFilters()}
map.on('zoomend',majZoom);
gAdrCtl.on('add remove',majAdr);

// Filtres d'affichage
const filtre={don:true,absent:true,inoccupe:true};
function applyFilters(){
  touched.forEach(mk=>{
    const show=Object.values(mk.L).some(r=>filtre[r.type]!==false);
    if(mk.gps){(show&&zoomOk())?mk.addTo(map):mk.remove()}
    else{show?gAdr.addLayer(mk):gAdr.removeLayer(mk)}
  });

}
document.querySelectorAll('#filtres button').forEach(b=>{
  b.classList.add('on');
  b.onclick=()=>{const t=b.dataset.t;filtre[t]=!filtre[t];b.classList.toggle('on',filtre[t]);applyFilters()};
});

// Points d'adresse (cliquables)
function popupAdr(a,gps){
  const d=document.createElement('div');
  d.innerHTML=`<b>${esc(a.adresse)||(a.manuel?'Point placé à la main':'Position GPS')}</b><br>${ligneEq(a)?ligneEq(a)+'<br>':''}${a.statut?esc(a.statut)+'<br>':''}`;
  [['💶 Don','don'],['🚪 Absent','absent'],['🏚️ Inoccupé','inoccupe']].filter(x=>!gps||x[1]!=='inoccupe').forEach(([t,ty])=>{
    const b=document.createElement('button');
    b.textContent=t;b.style.cssText='margin:6px 4px 0 0;padding:8px 10px;font-size:15px';
    b.onclick=()=>{map.closePopup();ouvrir(ty,a)};
    d.appendChild(b);
  });
  return d;
}
const LAB={don:'💶 Don',absent:'🚪 Absent',inoccupe:'🏚️ Inoccupé'},NOMS={don:'Don',absent:'Absent',inoccupe:'Inoccupé'};
const statutTxt=r=>(r.type==='don'?r.montant+' € ('+r.mode+')':NOMS[r.type])+(r.note?' — '+r.note:'');
function popupMk(mk,extra){
  const a=mk.a;
  const d=document.createElement('div');
  d.innerHTML=`<b>${esc(a.adresse)||'Position GPS'}</b><br>${ligneEq(a)?ligneEq(a)+'<br>':''}`;
  const nums=Object.keys(mk.L).map(Number);
  if(extra&&!nums.includes(extra))nums.push(extra);
  if(!nums.length)nums.push(1);
  nums.sort((x,y)=>x-y);
  nums.forEach(n=>{
    const rec=mk.L[n],multi=nums.length>1;
    const bloc=document.createElement('div');
    bloc.style.cssText='margin-top:8px;padding-top:6px;'+(multi?'border-top:1px solid #ddd':'');
    bloc.innerHTML=(multi?`<b>Logement ${n}</b>`:'')+(rec?`${multi?' — ':''}${esc(rec.nom)||'(sans nom)'}<br><small>${esc(statutTxt(rec))}</small><br>`:(multi?'<br>':''));
    // Un don ne peut plus être modifié après le jour où il a été enregistré
    const jr=rec&&rec.type==='don'?jourLocal(rec.date):'';
    if(jr&&jr!==jourLocal(new Date().toISOString())){
      bloc.insertAdjacentHTML('beforeend',`<span style="color:#555">🔒 Don du ${esc(jr.split('-').reverse().join('/'))} — non modifiable</span>`);
      d.appendChild(bloc);return;
    }
    ['don','absent','inoccupe'].filter(t=>!mk.gps||t!=='inoccupe').forEach(t=>{
      const act=rec&&rec.type===t,b=document.createElement('button');
      b.textContent=LAB[t];
      b.style.cssText=`margin:4px 4px 0 0;padding:8px 10px;font-size:15px;border:2px solid ${COLS[t]};border-radius:8px;background:${act?COLS[t]:'#fff'};color:${act?'#fff':'#333'}`;
      b.onclick=()=>{
        if(act&&t==='inoccupe')return;
        if(rec&&!act&&!confirm('Modifier ce logement ?\n'+(rec.nom||'(sans nom)')+' : '+NOMS[rec.type]+' → '+NOMS[t]))return;
        map.closePopup();ouvrir(t,a,n,rec);
      };
      bloc.appendChild(b);
    });
    d.appendChild(bloc);
  });
  if(Object.keys(mk.L).length&&!extra){
    const b=document.createElement('button');
    b.textContent='➕ Ajouter un logement';
    b.style.cssText='margin-top:10px;padding:8px 10px;font-size:15px;width:100%;border:2px dashed #1a73e8;border-radius:8px;background:#fff;color:#1a73e8';
    b.onclick=()=>showAdr(mk,Math.max(...Object.keys(mk.L).map(Number))+1);
    d.appendChild(b);
  }
  return d;
}
function showAdr(mk,extra){if(placement)stopPlacement();L.popup({maxHeight:320}).setLatLng(mk.getLatLng()).setContent(popupMk(mk,extra)).openOn(map)}
gAdr.on('click',e=>showAdr(e.layer));
function chargerAdresses(){
  return fetch('adresses.geojson?v='+Date.now()).then(r=>r.json()).then(d=>{
    d.features.forEach(f=>{
      const [lng,lat]=f.geometry.coordinates;
      const a={id:f.properties.id,adresse:f.properties.adr,nom:'',lat,lng,statut:''};
      const mk=L.circleMarker([lat,lng],{radius:5,color:'#fff',weight:1,fillColor:'#777',fillOpacity:.9}).addTo(gAdr);
      mk.a=a;mk.L={};pts[a.id]=mk;
    });
  }).catch(()=>{});
}
// Chargement initial puis actualisation automatique (1 min) des saisies des autres
let vus=0,encours=false;
const traiter=rows=>rows.forEach(r=>{try{addMarker(r)}catch(e){}});
Promise.all([chargerAdresses(),fetch(API).then(r=>r.json()).catch(()=>[])]).then(([_,rows])=>{rows=Array.isArray(rows)?rows:[];vus=rows.reduce((m,r)=>Math.max(m,Number(r.maj)||0),0);traiter(rows);majEtat()});
function actualiser(){
  if(encours||document.hidden||!navigator.onLine)return;
  encours=true;flush();
  fetch(API+'?depuis='+vus).then(r=>r.json()).then(d=>{
    if(!d||typeof d.n!=='number')return;
    traiter(d.rows||[]);vus=d.n;majEtat();
  }).catch(()=>{}).finally(()=>{encours=false});
}
setInterval(actualiser,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)actualiser()});
majZoom();
flush();
window.addEventListener('online',flush);
</script>
